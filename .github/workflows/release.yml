name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example: 0.1.4)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7

      - name: Resolve and validate release version
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
          else
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

          test "$VERSION" = "$(cat VERSION)"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

          python3 scripts/validate.py

      - name: Build install ZIP
        shell: bash
        run: |
          python3 scripts/package.py --version "$VERSION"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            gh release create "$TAG" \
              "dist/ClassVoiceAlertSuite-${VERSION}.zip" \
              --target "$GITHUB_SHA" \
              --title "ClassVoiceAlert $TAG" \
              --generate-notes
          else
            gh release create "$TAG" \
              "dist/ClassVoiceAlertSuite-${VERSION}.zip" \
              --title "ClassVoiceAlert $TAG" \
              --generate-notes
          fi
