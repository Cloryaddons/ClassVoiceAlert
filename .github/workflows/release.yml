name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7

      - name: Validate tag and source version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$VERSION" = "$(cat VERSION)"
          python3 scripts/validate.py

      - name: Build install ZIP
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/package.py --version "$VERSION"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/ClassVoiceAlertSuite-${VERSION}.zip" \
            --title "ClassVoiceAlert ${GITHUB_REF_NAME}" \
            --generate-notes
