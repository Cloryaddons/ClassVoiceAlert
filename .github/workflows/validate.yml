name: Validate

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate repository
        run: python3 scripts/validate.py
      - name: Test package build
        run: python3 scripts/package.py
