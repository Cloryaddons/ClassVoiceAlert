name: Feature request
description: Suggest a new alert or framework improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Core / shared framework
        - Death Knight
        - New class
        - Existing module
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: Describe the gameplay or maintenance problem first.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional notes
